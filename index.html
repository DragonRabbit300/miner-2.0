<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Forge</title>

<style>
body {
    background:#0f0f0f;
    color:#f2f2f2;
    font-family: monospace;
    margin:0;
}

#game {
    max-width:420px;
    margin:auto;
    padding:10px;
}

h1 { text-align:center; }

.panel {
    border:3px solid #444;
    background:#141414;
    padding:8px;
    margin-bottom:8px;
}

button, select {
    width:100%;
    margin-top:6px;
    padding:10px;
    font-size:16px;
    background:#2b2b2b;
    color:white;
    border:2px solid #555;
}

.bar {
    height:16px;
    background:#222;
    border:2px solid #444;
    margin-top:4px;
    position:relative;
}

.fill {
    height:100%;
    width:0%;
    background:#ff7b00;
}

.optimal {
    position:absolute;
    top:0;
    height:100%;
    background:rgba(0,255,0,0.3);
}

.pixel {
    width:16px;
    height:16px;
    background:#888;
    display:inline-block;
    margin-right:4px;
}
</style>
</head>

<body>
<div id="game">

<h1>PIXEL FORGE</h1>

<div class="panel">
<b>Location</b>
<select id="location"></select>
<button onclick="gather()">Gather Materials</button>
<div id="gatherResult"></div>
</div>

<div class="panel">
<b>Inventory</b>
<div id="inventory"></div>
</div>

<div class="panel">
<b>Forge Setup</b>
<select id="materialA"></select>
<select id="materialB"></select>
</div>

<div class="panel">
<b>Heat</b>
<div class="bar">
    <div class="optimal" id="heatOptimal"></div>
    <div class="fill" id="heatBar"></div>
</div>
<button onclick="heat()">Add Heat</button>
</div>

<div class="panel">
<b>Hammer</b>
<div class="bar">
    <div class="fill" id="shapeBar"></div>
</div>
<button onclick="hammer()">Hammer</button>
</div>

<div class="panel">
<button onclick="quench()">Quench & Finish</button>
</div>

<div class="panel">
<b>Result</b>
<div id="result">None</div>
</div>

</div>

<script>
const materials = {
    Copper:{min:30,max:50,diff:0.7},
    Tin:{min:25,max:45,diff:0.6},
    Iron:{min:45,max:65,diff:1},
    Coal:{min:0,max:100,diff:0.2},
    Steel:{min:55,max:75,diff:1.3},
    Silver:{min:35,max:55,diff:0.8},
    Gold:{min:30,max:45,diff:0.5},
    Obsidian:{min:60,max:70,diff:1.6},
    Mythril:{min:65,max:85,diff:1.9},
    Adamantite:{min:70,max:90,diff:2.3}
};

const locations = {
    Riverbank:["Copper","Tin"],
    Hills:["Iron","Coal"],
    Mountains:["Steel"],
    Ruins:["Silver","Gold"],
    Volcano:["Obsidian"],
    "Deep Cavern":["Mythril"],
    "Ancient Forge":["Adamantite"]
};

let inventory = { Iron:2 };
let heatLevel = 0;
let shape = 0;

function init() {
    const loc = document.getElementById("location");
    for (let l in locations) loc.innerHTML += `<option>${l}</option>`;
    updateInventory();
}
init();

function updateInventory() {
    let html = "";
    for (let m in inventory) {
        html += `<div class="pixel"></div>${m}: ${inventory[m]}<br>`;
    }
    document.getElementById("inventory").innerHTML = html;

    const selects = [materialA, materialB];
    selects.forEach(s=>{
        s.innerHTML = "<option value=''>None</option>";
        for (let m in inventory) if (inventory[m]>0) s.innerHTML += `<option>${m}</option>`;
    });
}

function gather() {
    const l = location.value;
    const pool = locations[l];
    const found = pool[Math.floor(Math.random()*pool.length)];
    inventory[found] = (inventory[found]||0)+1;
    document.getElementById("gatherResult").innerText = "Found "+found;
    updateInventory();
}

function forgeStats() {
    const a = materialA.value;
    const b = materialB.value;
    let mats = [a,b].filter(x=>x);
    let min=0,max=0,diff=0;
    mats.forEach(m=>{
        min+=materials[m].min;
        max+=materials[m].max;
        diff+=materials[m].diff;
    });
    return {
        min:min/mats.length,
        max:max/mats.length,
        diff:diff/mats.length
    };
}

function heat() {
    heatLevel = Math.min(100, heatLevel+6);
    heatBar.style.width = heatLevel+"%";
    const s = forgeStats();
    heatOptimal.style.left = s.min+"%";
    heatOptimal.style.width = (s.max-s.min)+"%";
}

function hammer() {
    const s = forgeStats();
    let bonus = (heatLevel>=s.min && heatLevel<=s.max)?1:0.3;
    shape = Math.min(100, shape + (8*bonus/s.diff));
    shapeBar.style.width = shape+"%";
}

function quench() {
    if (shape < 100) {
        result.innerText = "Ruined — poor shaping.";
    } else {
        const s = forgeStats();
        let grade = (heatLevel>=s.min && heatLevel<=s.max)?"Masterwork":"Flawed";
        result.innerText = grade+" forged item";
        [materialA.value,materialB.value].forEach(m=>{
            if (m) inventory[m]--;
            if (inventory[m]<=0) delete inventory[m];
        });
    }
    heatLevel=0;shape=0;
    heatBar.style.width="0%";
    shapeBar.style.width="0%";
    updateInventory();
}
</script>

</body>
</html>
