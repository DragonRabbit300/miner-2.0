<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Forge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* =========================
   GLOBAL STYLE
========================= */
* { box-sizing:border-box; }

body {
 margin:0;
 background:#0b0b0b;
 color:#e6e6e6;
 font-family: monospace;
}

#game {
 max-width:460px;
 margin:auto;
 padding:10px;
}

/* =========================
   PANELS
========================= */
.panel {
 background:#141414;
 border:3px solid #3a3a3a;
 margin-bottom:10px;
 padding:8px;
}

h1,h2 {
 text-align:center;
 margin:6px 0;
}

/* =========================
   BUTTONS
========================= */
button, select {
 width:100%;
 padding:10px;
 margin-top:6px;
 background:#242424;
 color:#fff;
 border:2px solid #555;
 font-size:14px;
 cursor:pointer;
}

button:hover { background:#333; }
button:disabled { opacity:.4; cursor:not-allowed; }

/* =========================
   PIXEL UI ELEMENTS
========================= */
.pixel {
 width:6px;
 height:6px;
 background:#ccc;
 display:inline-block;
 margin-right:3px;
}

.bar {
 height:14px;
 background:#222;
 border:2px solid #444;
 margin-top:4px;
 position:relative;
}

.fill {
 height:100%;
 width:0%;
}

.heat { background:#ff7b00; box-shadow:0 0 6px #ff7b00; }
.shape { background:#4cff4c; }

.optimal {
 position:absolute;
 height:100%;
 background:rgba(0,255,0,0.25);
}

/* =========================
   FORGE GRAPHICS
========================= */
#forgeScene {
 height:120px;
 background:#0f0f0f;
 border:2px solid #333;
 position:relative;
 margin-top:6px;
 overflow:hidden;
}

.fire {
 position:absolute;
 bottom:0;
 left:50%;
 width:30px;
 height:40px;
 background:#ff5500;
 transform:translateX(-50%);
 animation:flicker .3s infinite alternate;
}

@keyframes flicker {
 from { height:35px; opacity:.8; }
 to { height:40px; opacity:1; }
}

.anvil {
 position:absolute;
 bottom:0;
 left:50%;
 width:60px;
 height:20px;
 background:#666;
 transform:translateX(-50%);
}

.hammer {
 position:absolute;
 top:0;
 right:20px;
 width:30px;
 height:6px;
 background:#aaa;
 transform-origin:right center;
}

/* =========================
   ANIMATIONS
========================= */
.shake { animation:shake .1s; }

@keyframes shake {
 0%{transform:translateX(-2px);}
 50%{transform:translateX(2px);}
 100%{transform:translateX(0);}
}

.spark {
 position:absolute;
 width:4px;
 height:4px;
 background:#ffdd55;
 animation:spark .5s forwards;
}

@keyframes spark {
 from{opacity:1;}
 to{opacity:0; transform:translateY(-20px);}
}

/* =========================
   SKILL TREE
========================= */
.skill {
 border:1px solid #555;
 padding:6px;
 margin-top:6px;
}

.locked { opacity:.4; }

/* =========================
   MARKET
========================= */
.marketItem {
 border-bottom:1px solid #444;
 padding:4px 0;
}
</style>
</head>

<body>
<div id="game">

<h1>PIXEL FORGE</h1>

<!-- =========================
     PLAYER STATS
========================= -->
<div class="panel">
Gold: <span id="gold">0</span> |
Skill Points: <span id="sp">0</span>
</div>

<!-- =========================
     GATHERING
========================= -->
<div class="panel">
<h2>Gather</h2>
<select id="locationSelect"></select>
<button onclick="gather()">Mine Ore</button>
<div id="gatherResult"></div>
</div>

<!-- =========================
     INVENTORY
========================= -->
<div class="panel">
<h2>Inventory</h2>
<div id="inventory"></div>
</div>

<!-- =========================
     FORGE
========================= -->
<div class="panel">
<h2>Forge</h2>

<select id="materialA"></select>
<select id="materialB"></select>

<div id="forgeScene">
 <div class="fire" id="fire"></div>
 <div class="anvil"></div>
 <div class="hammer" id="hammerSprite"></div>
</div>

<div class="bar">
 <div class="optimal" id="heatOptimal"></div>
 <div class="fill heat" id="heatBar"></div>
</div>
<button onclick="addHeat()">Stoke Fire</button>

<div class="bar">
 <div class="fill shape" id="shapeBar"></div>
</div>
<button onclick="hammer()">Hammer</button>
<button onclick="quench()">Quench</button>
</div>

<!-- =========================
     MARKET
========================= -->
<div class="panel">
<h2>Market</h2>
<div id="marketItem">No item</div>
<button onclick="sell()">Sell Item</button>
</div>

<!-- =========================
     SKILLS
========================= -->
<div class="panel">
<h2>Skill Tree</h2>
<div id="skills"></div>
</div>

<!-- =========================
     LOG
========================= -->
<div class="panel">
<h2>Log</h2>
<div id="log"></div>
</div>

</div>

<script>
/* =========================================================
   DATA DEFINITIONS
========================================================= */

const materials = {
 Iron:{min:45,max:65,diff:1,price:20},
 Steel:{min:55,max:75,diff:1.3,price:40},
 Obsidian:{min:60,max:70,diff:1.6,price:70},
 Mythril:{min:65,max:85,diff:2.0,price:120}
};

const locations = {
 Hills:["Iron"],
 Mountains:["Steel"],
 Volcano:["Obsidian"],
 DeepCavern:["Mythril"]
};

/* =========================================================
   GAME STATE
========================================================= */
let state = JSON.parse(localStorage.getItem("PF_SAVE")) || {
 inventory:{Iron:2},
 gold:0,
 sp:0,
 forged:null,
 heat:0,
 shape:0,
 skills:{heat:0,precision:0,efficiency:0,merchant:0}
};

/* =========================================================
   DOM
========================================================= */
const locationSelect = document.getElementById("locationSelect");
const inventoryDiv = document.getElementById("inventory");
const logDiv = document.getElementById("log");

/* =========================================================
   INIT
========================================================= */
function init(){
 for(let l in locations){
  locationSelect.innerHTML+=`<option value="${l}">${l}</option>`;
 }
 updateUI();
 setInterval(tick,50);
}
init();

/* =========================================================
   MAIN LOOP
========================================================= */
function tick(){
 state.heat=Math.max(0,state.heat-(0.15-state.skills.heat*0.03));
 heatBar.style.width=state.heat+"%";
 save();
}

/* =========================================================
   UI
========================================================= */
function log(msg){
 logDiv.innerHTML=msg+"<br>"+logDiv.innerHTML;
}

function updateUI(){
 gold.innerText=state.gold;
 sp.innerText=state.sp;

 inventoryDiv.innerHTML="";
 for(let m in state.inventory){
  inventoryDiv.innerHTML+=`<span class="pixel"></span>${m}: ${state.inventory[m]}<br>`;
 }

 [materialA,materialB].forEach(sel=>{
  sel.innerHTML="<option value=''>None</option>";
  for(let m in state.inventory){
   sel.innerHTML+=`<option>${m}</option>`;
  }
 });

 marketItem.innerText=state.forged?state.forged.name:"No item";
 renderSkills();
}

/* =========================================================
   GATHER
========================================================= */
function gather(){
 let loc=locationSelect.value;
 let ore=locations[loc][0];
 state.inventory[ore]=(state.inventory[ore]||0)+1;
 log("Mined "+ore);
 updateUI();
}

/* =========================================================
   FORGE LOGIC
========================================================= */
function forgeStats(){
 let mats=[materialA.value,materialB.value].filter(Boolean);
 if(!mats.length) return null;

 let min=0,max=0,diff=0;
 mats.forEach(m=>{
  min+=materials[m].min;
  max+=materials[m].max;
  diff+=materials[m].diff;
 });

 min/=mats.length;
 max/=mats.length;
 diff/=mats.length;

 heatOptimal.style.left=min+"%";
 heatOptimal.style.width=(max-min)+"%";

 return{mats,min,max,diff};
}

function addHeat(){
 state.heat=Math.min(100,state.heat+8);
 heatBar.style.width=state.heat+"%";
}

function hammer(){
 let s=forgeStats();
 if(!s) return;

 hammerSprite.style.transform="rotate(-40deg)";
 setTimeout(()=>hammerSprite.style.transform="rotate(0deg)",100);

 state.shape+=6/s.diff;
 state.shape=Math.min(100,state.shape);
 shapeBar.style.width=state.shape+"%";

 spawnSparks();
}

function quench(){
 let s=forgeStats();
 if(!s) return;

 if(state.shape>=100){
  state.forged={
   name:s.mats.join("+"),
   value:s.mats.reduce((t,m)=>t+materials[m].price,0)
  };
  state.sp++;
  log("Forged "+state.forged.name);
  s.mats.forEach(m=>{
   if(Math.random()>state.skills.efficiency*0.2){
    state.inventory[m]--;
    if(state.inventory[m]<=0) delete state.inventory[m];
   }
  });
 } else log("Forge failed");

 state.heat=0;
 state.shape=0;
 heatBar.style.width=shapeBar.style.width="0%";
 updateUI();
}

/* =========================================================
   MARKET
========================================================= */
function sell(){
 if(!state.forged){ log("Nothing to sell"); return; }
 let price=state.forged.value*(1+state.skills.merchant*0.15);
 state.gold+=Math.floor(price);
 log("Sold for "+Math.floor(price)+" gold");
 state.forged=null;
 updateUI();
}

/* =========================================================
   SKILLS
========================================================= */
function renderSkills(){
 skills.innerHTML="";
 for(let k in state.skills){
  let cost=state.skills[k]+1;
  skills.innerHTML+=`
   <div class="skill">
    ${k.toUpperCase()} Lv ${state.skills[k]}
    <button onclick="buySkill('${k}')" ${state.sp<cost?"disabled":""}>
     Upgrade (${cost})
    </button>
   </div>`;
 }
}

function buySkill(k){
 let cost=state.skills[k]+1;
 if(state.sp>=cost){
  state.sp-=cost;
  state.skills[k]++;
  updateUI();
 }
}

/* =========================================================
   FX
========================================================= */
function spawnSparks(){
 for(let i=0;i<5;i++){
  let s=document.createElement("div");
  s.className="spark";
  s.style.left=200+Math.random()*40+"px";
  s.style.bottom="30px";
  forgeScene.appendChild(s);
  setTimeout(()=>s.remove(),500);
 }
}

/* =========================================================
   SAVE
========================================================= */
function save(){
 localStorage.setItem("PF_SAVE",JSON.stringify(state));
}
</script>
</body>
</html>
