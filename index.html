<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Forge</title>

<style>
body {
    background:#0b0b0b;
    color:#f2f2f2;
    font-family: monospace;
    margin:0;
}

#game {
    max-width:420px;
    margin:auto;
    padding:10px;
}

h1 { text-align:center; }

.panel {
    border:3px solid #444;
    background:#141414;
    padding:8px;
    margin-bottom:8px;
}

button, select {
    width:100%;
    margin-top:6px;
    padding:10px;
    font-size:16px;
    background:#2b2b2b;
    color:white;
    border:2px solid #555;
}

.bar {
    height:16px;
    background:#222;
    border:2px solid #444;
    margin-top:4px;
    position:relative;
}

.fill {
    height:100%;
    width:0%;
}

.heat { background:#ff7b00; }
.shape { background:#4cff4c; }

.optimal {
    position:absolute;
    top:0;
    height:100%;
    background:rgba(0,255,0,0.25);
}

.marker {
    position:absolute;
    width:4px;
    height:100%;
    background:#fff;
}

.pixel {
    width:16px;
    height:16px;
    background:#888;
    display:inline-block;
    margin-right:4px;
}

.locked {
    color:#777;
}
</style>
</head>

<body>
<div id="game">

<h1>PIXEL FORGE</h1>

<div class="panel">
<b>Location</b>
<select id="location"></select>
<button onclick="gather()">Gather</button>
<div id="gatherResult"></div>
</div>

<div class="panel">
<b>Inventory</b>
<div id="inventory"></div>
</div>

<div class="panel">
<b>Forge Setup</b>
<select id="materialA"></select>
<select id="materialB"></select>
</div>

<div class="panel">
<b>Heat</b>
<div class="bar">
    <div class="optimal" id="heatOptimal"></div>
    <div class="fill heat" id="heatBar"></div>
</div>
<button onclick="addHeat()">Stoke Fire</button>
</div>

<div class="panel">
<b>Hammer Timing</b>
<div class="bar">
    <div class="optimal" id="hitZone"></div>
    <div class="marker" id="cursor"></div>
</div>
<button onclick="hammer()">Strike</button>
</div>

<div class="panel">
<b>Shape Progress</b>
<div class="bar">
    <div class="fill shape" id="shapeBar"></div>
</div>
</div>

<div class="panel">
<button onclick="quench()">Quench & Finish</button>
</div>

<div class="panel">
<b>Result</b>
<div id="result">None</div>
</div>

</div>

<audio id="fire" loop src="https://cdn.pixabay.com/audio/2022/03/15/audio_8d1f7ffb9c.mp3"></audio>
<audio id="hammerSnd" src="https://cdn.pixabay.com/audio/2022/03/15/audio_7e6b8f1b62.mp3"></audio>
<audio id="quenchSnd" src="https://cdn.pixabay.com/audio/2022/03/15/audio_16c7eec89f.mp3"></audio>

<script>
const materials = {
 Iron:{min:45,max:65,diff:1},
 Steel:{min:55,max:75,diff:1.3},
 Silver:{min:35,max:55,diff:0.8},
 Gold:{min:30,max:45,diff:0.6},
 Obsidian:{min:60,max:70,diff:1.6},
 Mythril:{min:65,max:85,diff:1.9},
 Adamantite:{min:70,max:90,diff:2.3}
};

const locations = {
 Riverbank:{ores:["Silver"],unlock:0},
 Hills:{ores:["Iron"],unlock:0},
 Mountains:{ores:["Steel"],unlock:3},
 Volcano:{ores:["Obsidian"],unlock:6},
 "Deep Cavern":{ores:["Mythril"],unlock:10},
 "Ancient Forge":{ores:["Adamantite"],unlock:15}
};

let inventory = { Iron:2 };
let heat = 0;
let shape = 0;
let forged = 0;
let cursor = 0;
let dir = 1;

fire.volume = 0.4;
fire.play();

function init(){
 updateLocations();
 updateInventory();
 setInterval(()=>{
  heat = Math.max(0, heat-0.15);
  heatBar.style.width = heat+"%";
  cursor += dir*2;
  if(cursor>100||cursor<0) dir*=-1;
  document.getElementById("cursor").style.left = cursor+"%";
 },50);
}
init();

function updateLocations(){
 location.innerHTML="";
 for(let l in locations){
  if(forged>=locations[l].unlock)
   location.innerHTML+=`<option>${l}</option>`;
  else
   location.innerHTML+=`<option disabled class="locked">${l} (Locked)</option>`;
 }
}

function updateInventory(){
 inventoryDiv.innerHTML="";
 for(let m in inventory)
  inventoryDiv.innerHTML+=`<div class="pixel"></div>${m}: ${inventory[m]}<br>`;

 [materialA,materialB].forEach(s=>{
  s.innerHTML="<option value=''>None</option>";
  for(let m in inventory)
   s.innerHTML+=`<option>${m}</option>`;
 });
}

function gather(){
 let pool = locations[location.value].ores;
 let ore = pool[Math.floor(Math.random()*pool.length)];
 inventory[ore]=(inventory[ore]||0)+1;
 gatherResult.innerText="Found "+ore;
 updateInventory();
}

function stats(){
 let mats=[materialA.value,materialB.value].filter(x=>x);
 let s={min:0,max:0,diff:0};
 mats.forEach(m=>{
  s.min+=materials[m].min;
  s.max+=materials[m].max;
  s.diff+=materials[m].diff;
 });
 s.min/=mats.length; s.max/=mats.length; s.diff/=mats.length;
 heatOptimal.style.left=s.min+"%";
 heatOptimal.style.width=(s.max-s.min)+"%";
 hitZone.style.left="45%";
 hitZone.style.width="10%";
 return s;
}

function addHeat(){
 heat=Math.min(100,heat+8);
 heatBar.style.width=heat+"%";
 stats();
}

function hammer(){
 hammerSnd.play();
 let s=stats();
 let hit=Math.abs(cursor-50);
 if(hit<5 && heat>=s.min && heat<=s.max){
  shape+=10/s.diff;
 } else if(hit<12){
  shape+=4/s.diff;
 } else {
  shape-=6;
 }
 shape=Math.max(0,Math.min(100,shape));
 shapeBar.style.width=shape+"%";
}

function quench(){
 quenchSnd.play();
 if(shape>=100){
  result.innerText="Forged successfully!";
  forged++;
  updateLocations();
 } else result.innerText="Ruined item.";
 [materialA.value,materialB.value].forEach(m=>{
  if(m){ inventory[m]--; if(inventory[m]<=0) delete inventory[m]; }
 });
 heat=shape=0;
 heatBar.style.width=shapeBar.style.width="0%";
 updateInventory();
}
</script>
</body>
</html>
